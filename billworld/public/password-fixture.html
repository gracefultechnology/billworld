<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillWorld simulation</title>
  <style>
    body { margin: 0; font: 1.125rem system-ui, sans-serif; line-height: 1.5; }
    main { box-sizing: border-box; max-width: 36rem; margin: auto; padding: 2rem; }
    form:not([hidden]), label { display: grid; gap: .5rem; }
    form { gap: 1rem; }
    input, button { box-sizing: border-box; font: inherit; min-height: 3rem; padding: .5rem .75rem; }
    button { justify-self: start; }
  </style>
  <script src="/password-fixture.js" defer></script>
</head>
<body>
  <main>
    <h1>BillWorld simulation</h1>
    <p>Use the synthetic sign-in provided for this exercise.</p>
    <form id="password-fixture" method="post" data-family="%FAMILY%">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" disabled>Sign in</button>
      <p role="alert" id="sign-in-result"></p>
    </form>
    <section id="account" aria-labelledby="account-heading" hidden>
      <h2 id="account-heading" tabindex="-1">Account overview</h2>
      <p>You’re signed in to your synthetic account.</p>
    </section>
  </main>
</body>
</html>
